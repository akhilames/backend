# ========================================
# SERVER CONFIGURATION
# ========================================
# Render dynamic port isthundi, lekapote localhost lo 8080 vaduthundi
server.port=${PORT:8080}

# ========================================
# POSTGRESQL DATABASE
# ========================================
# Render environment variables unte vaduthundi, lekapote local DB ki connect avuthundi
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/water_billing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:newpass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

