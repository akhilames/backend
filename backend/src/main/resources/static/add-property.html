<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Property</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f6f8;
        }

        h1 {
            color: #222;
        }

        .form-box {
            background: white;
            padding: 25px;
            max-width: 550px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #6b7280;
            margin-left: 8px;
        }

        .back:hover {
            background: #4b5563;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>

</head>

<body>

<h1>Add Property</h1>

<div class="form-box">

    <form id="propertyForm">

        <label for="propertyNo">
            Property Number:
        </label>

        <input
                type="text"
                id="propertyNo"
                placeholder="Example: P-103"
                required
        >


        <label for="address">
            Address:
        </label>

        <input
                type="text"
                id="address"
                placeholder="Example: Nuzvid"
                required
        >


        <label for="meterNumber">
            Meter Number:
        </label>

        <input
                type="text"
                id="meterNumber"
                placeholder="Example: MTR-103"
                required
        >


        <label for="residentId">
            Resident ID:
        </label>

        <input
                type="number"
                id="residentId"
                placeholder="Example: 1"
                min="1"
                required
        >


        <label for="flatSize">
            Flat Size (sq.ft):
        </label>

        <input
                type="number"
                id="flatSize"
                placeholder="Example: 1200"
                min="1"
                step="0.01"
                required
        >


        <label for="occupancy">
            Number of Occupants:
        </label>

        <input
                type="number"
                id="occupancy"
                placeholder="Example: 4"
                min="1"
                step="1"
                required
        >


        <button type="submit">
            Create Property
        </button>

        <button
                type="button"
                class="back"
                onclick="window.location.href='/admin-dashboard.html'">

            Back to Dashboard

        </button>

    </form>

    <p id="message"></p>

</div>


<script>

    document.getElementById("propertyForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const request = {

                propertyNo:
                    document.getElementById("propertyNo").value.trim(),

                address:
                    document.getElementById("address").value.trim(),

                meterNumber:
                    document.getElementById("meterNumber").value.trim(),

                residentId:
                    document.getElementById("residentId").value,

                flatSize:
                    document.getElementById("flatSize").value,

                occupancy:
                    document.getElementById("occupancy").value
            };


            const message =
                document.getElementById("message");

            message.textContent =
                "Creating property...";


            try {

                const response =
                    await fetch(
                        "/api/properties",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(request)
                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    message.textContent =
                        "Property created successfully!";

                    document.getElementById("propertyForm")
                        .reset();

                } else {

                    message.textContent =
                        data.message ||
                        "Failed to create property";
                }


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Server connection failed";
            }

        });

</script>

</body>

</html>
